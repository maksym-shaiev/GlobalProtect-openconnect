name: Build gpclient-smc binary

on:
  push:
    branches: [smc-distribution]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            suffix: ubuntu24.04
            arch: amd64
          - runner: ubuntu-26.04
            suffix: ubuntu26.04
            arch: amd64
          - runner: ubuntu-24.04
            suffix: arch
            arch: x86_64
            container: archlinux:base-devel

    steps:
      - name: Install build dependencies (Arch container)
        if: matrix.container != ''
        run: |
          pacman -Syu --noconfirm git curl \
            libxml2 zlib lz4 gnutls p11-kit nettle gmp

      - name: Install build dependencies (Ubuntu)
        if: matrix.container == ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autopoint libtool gettext patch pkg-config \
            libxml2-dev zlib1g-dev liblz4-dev libgnutls28-dev \
            libp11-kit-dev nettle-dev libgmp-dev

      - name: Checkout smc-distribution (includes feat/print-cookie patch)
        uses: actions/checkout@v4
        with:
          ref: smc-distribution
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.suffix }}

      - name: Build gpclient (CLI only, no GUI)
        run: cargo build --release -p gpclient --no-default-features

      - name: Prepare release assets
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          BINARY_NAME="gpclient-smc_${VERSION}_${{ matrix.suffix }}_${{ matrix.arch }}"
          SUMS_NAME="SHA256SUMS-${{ matrix.suffix }}"
          cp target/release/gpclient "$BINARY_NAME"
          strip "$BINARY_NAME"
          sha256sum "$BINARY_NAME" > "$SUMS_NAME"
          echo "BINARY_NAME=$BINARY_NAME" >> "$GITHUB_ENV"
          echo "SUMS_NAME=$SUMS_NAME"     >> "$GITHUB_ENV"
          echo "Built binary: $BINARY_NAME"
          ls -lh "$BINARY_NAME"
          cat "$SUMS_NAME"

      - name: "Publish to GitHub Release (tag: gpclient-smc-latest)"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gpclient-smc-latest
          name: gpclient-smc latest build
          body: |
            Automated build of `gpclient` with the `--print-cookie` patch applied.

            Branch: `smc-distribution` (built on top of `feat/print-cookie`)

            Used by [smc-gp-vpn](https://github.com/maksym-shaiev/smc-gp-vpn) installer.
          make_latest: true
          files: |
            ${{ env.BINARY_NAME }}
            ${{ env.SUMS_NAME }}
